<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — AVANT LE SILENCE</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: #272522;
      background: #f4efe5;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 560px;
      padding: clamp(1.5rem, 5vw, 3rem);
      text-align: center;
      background: #f7f1e6;
      border: 1px solid rgba(39, 37, 34, 0.14);
      border-radius: 14px;
      box-shadow: 0 24px 70px rgba(40, 30, 20, 0.12);
    }
    .mark { width: 64px; height: 64px; margin: 0 auto 1rem; color: #7a5c43; }
    p.eyebrow {
      margin: 0 0 0.6rem;
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #7a5c43;
    }
    h1 {
      margin: 0 0 0.7rem;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 500;
      line-height: 1.12;
    }
    p { margin: 0 0 1rem; color: #4d4943; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; margin-top: 1.4rem; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.6rem 1rem;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 7px;
    }
    a.primary { color: #f4efe5; background: #272522; border: 1px solid #272522; }
    a.secondary { color: #405a6b; background: #dbe4e9; border: 1px solid rgba(64, 90, 107, 0.24); }
    a:focus-visible { outline: 3px solid #405a6b; outline-offset: 3px; }
    footer { margin-top: 1.4rem; font-size: 0.72rem; color: #736c62; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 29 32 11l22 18"/>
      <path d="M16 26v25h32V26"/>
      <path d="M27 51V37h10v14"/>
      <path d="M8 56h48"/>
    </svg>
    <p class="eyebrow">AVANT LE SILENCE</p>
    <h1>Cette page n'existe pas</h1>
    <p>Le parcours est organisé en chapitres. Revenez à l'accueil pour reprendre l'expérience.</p>
    <div class="actions">
      <a class="primary" href="./">Revenir à l'accueil</a>
      <a class="secondary" href="./#/chapitres">Voir les chapitres</a>
    </div>
    <footer>Une maison. Des vies. Une mémoire.</footer>
  </main>
</body>
</html>
