<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="maison-title maison-desc">
  <title id="maison-title">La maison et son environnement</title>
  <desc id="maison-desc">Illustration originale : une maison rurale au milieu d'arbres et de collines, dans une lumière douce. Reconstitution contemporaine, non photographique.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe6e4"/>
      <stop offset="0.55" stop-color="#eef0e8"/>
      <stop offset="1" stop-color="#f4efe5"/>
    </linearGradient>
    <linearGradient id="hill-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8d1c3"/>
      <stop offset="1" stop-color="#b8c4b2"/>
    </linearGradient>
    <linearGradient id="hill-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4c1a9"/>
      <stop offset="1" stop-color="#9dad93"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d3bb"/>
      <stop offset="1" stop-color="#c9c1a4"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d8bd"/>
      <stop offset="1" stop-color="#d8c5a6"/>
