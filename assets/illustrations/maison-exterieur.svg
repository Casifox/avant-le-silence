    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#96765a"/>
      <stop offset="1" stop-color="#7c5d45"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eee4d1"/>
      <stop offset="1" stop-color="#ddd0b8"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="0.78" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#fff7e7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff7e7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1e1c" stop-opacity="0"/>
      <stop offset="1" stop-color="#1f1e1c" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

