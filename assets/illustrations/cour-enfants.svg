  <g stroke="#f7f1e6" stroke-width="5" fill="none" opacity="0.92">
    <path d="M470 560h70v56h-70z"/>
    <path d="M505 560v-52M470 616h70v56h-70zM505 616v56"/>
    <path d="M470 672h70v48h-70z"/>
    <path d="M505 672v48"/>
    <path d="M540 648c38-8 64-2 76 18M540 648c-38-8-64-2-76 18"/>
  </g>
  <path d="M496 626h18M496 636h18M480 686h20M530 686h20" stroke="#f7f1e6" stroke-width="4" opacity="0.9"/>

