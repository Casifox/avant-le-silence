  <path d="M116 630c-6-70-4-138 2-206h24c6 74 6 144 2 206Z" fill="#7a5c43"/>
  <circle cx="130" cy="360" r="82" fill="#84977d"/>
  <circle cx="72" cy="400" r="52" fill="#93a58a"/>
  <circle cx="190" cy="398" r="58" fill="#778b71"/>

  <!-- Détails du sol -->
  <g fill="#a99b7e" opacity="0.4">
    <circle cx="260" cy="640" r="3"/>
    <circle cx="300" cy="680" r="2.5"/>
    <circle cx="820" cy="700" r="3"/>
    <circle cx="870" cy="660" r="2"/>
    <circle cx="380" cy="700" r="2.5"/>
  </g>
  <rect width="1200" height="750" fill="url(#light)"/>
</svg>
