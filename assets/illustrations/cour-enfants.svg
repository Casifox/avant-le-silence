  <circle cx="690" cy="644" r="36" fill="#b47c68"/>
  <path d="M690 608c10 20 12 44 0 72M654 644c34-8 68-8 72 0M668 616c18 10 26 36 22 56M712 616c-14 18-18 38-14 58" fill="none" stroke="#e8d8c1" stroke-width="3" opacity="0.8"/>
  <ellipse cx="690" cy="684" rx="40" ry="8" fill="#7a5c43" opacity="0.16"/>

  <!-- Banc -->
  <g>
    <rect x="900" y="540" width="220" height="20" rx="4" fill="#8a6a4f"/>
    <rect x="910" y="520" width="200" height="16" rx="3" fill="#9d8064"/>
    <path d="M918 560v92M1102 560v92" stroke="#6d543e" stroke-width="12" stroke-linecap="round"/>
    <path d="M918 606h184" stroke="#6d543e" stroke-width="7" stroke-linecap="round"/>
  </g>

