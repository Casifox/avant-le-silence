  <rect y="470" width="1200" height="280" fill="url(#yard)"/>
  <path d="M0 540c180-16 320 8 520-2 200-10 410-20 680 10v202H0Z" fill="#c9c0a3"/>
  <path d="M0 620c230-18 400 10 620-4 200-12 380-8 580 8v126H0Z" fill="#bdb294"/>

  <!-- Corde à linge -->
  <path d="M118 210c180 38 340 30 520 4 180-26 300-16 444 12" fill="none" stroke="#8a6a4f" stroke-width="3"/>
  <rect x="112" y="168" width="10" height="450" fill="#8a6a4f"/>
  <rect x="1076" y="196" width="10" height="422" fill="#8a6a4f"/>
