<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="cour-title cour-desc">
  <title id="cour-title">La cour de la colonie</title>
  <desc id="cour-desc">Illustration originale : une cour avec une façade, une corde à linge, une marelle dessinée au sol, un ballon et un banc. Aucune personne n'est représentée.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe6e5"/>
      <stop offset="1" stop-color="#f0eee5"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4d3b8"/>
      <stop offset="1" stop-color="#d2bda0"/>
    </linearGradient>
    <linearGradient id="yard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d1b8"/>
      <stop offset="1" stop-color="#c3b99b"/>
    </linearGradient>
    <radialGradient id="light" cx="0.22" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#fff6e2" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff6e2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#sky)"/>

  <!-- Façade -->
  <rect x="270" y="120" width="660" height="360" fill="url(#facade)"/>
  <path d="M240 130 600 20l360 110Z" fill="#8a6a4f"/>
  <path d="M240 130 600 20l360 110" fill="none" stroke="#6f533d" stroke-width="5" stroke-linejoin="round"/>
  <rect x="472" y="58" width="36" height="70" fill="#8e6d52"/>
  <rect x="466" y="50" width="48" height="14" fill="#6f533d"/>
  <g>
    <rect x="338" y="198" width="92" height="104" fill="#6f5b45"/>
    <rect x="346" y="206" width="76" height="88" fill="#dbe3df"/>
    <path d="M384 206v88M346 250h76" stroke="#b7b2a4" stroke-width="3"/>
    <rect x="322" y="202" width="16" height="96" fill="#72836d"/>
    <rect x="430" y="202" width="16" height="96" fill="#72836d"/>
  </g>
  <g>
    <rect x="556" y="198" width="92" height="104" fill="#6f5b45"/>
    <rect x="564" y="206" width="76" height="88" fill="#dbe3df"/>
    <path d="M602 206v88M564 250h76" stroke="#b7b2a4" stroke-width="3"/>
    <rect x="540" y="202" width="16" height="96" fill="#72836d"/>
    <rect x="648" y="202" width="16" height="96" fill="#72836d"/>
  </g>
  <g>
    <rect x="774" y="198" width="92" height="104" fill="#6f5b45"/>
    <rect x="782" y="206" width="76" height="88" fill="#dbe3df"/>
    <path d="M820 206v88M782 250h76" stroke="#b7b2a4" stroke-width="3"/>
    <rect x="758" y="202" width="16" height="96" fill="#72836d"/>
    <rect x="866" y="202" width="16" height="96" fill="#72836d"/>
  </g>
  <rect x="482" y="354" width="76" height="126" fill="#6b4f3a"/>
  <path d="M520 354v126" stroke="#5a4030" stroke-width="2" opacity="0.6"/>
  <circle cx="540" cy="418" r="3" fill="#c8b08f"/>
  <rect x="640" y="360" width="78" height="120" fill="#6b4f3a"/>
  <rect x="650" y="370" width="58" height="100" fill="#dbe3df"/>

