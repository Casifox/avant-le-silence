<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="lettres-title lettres-desc">
  <title id="lettres-title">La table des lettres</title>
  <desc id="lettres-desc">Illustration originale : un bureau avec des enveloppes, des feuilles, une loupe et une lampe. Les documents représentés sont abstraits et ne reproduisent aucune lettre réelle.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eae1d2"/>
      <stop offset="1" stop-color="#ddd0bc"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5ab89"/>
      <stop offset="1" stop-color="#a98d6b"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a17c59"/>
      <stop offset="1" stop-color="#7f5d42"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6eb"/>
      <stop offset="1" stop-color="#eee3d0"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe8bc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe8bc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#wall)"/>
  <rect y="570" width="1200" height="180" fill="url(#floor)"/>
  <path d="M0 570h1200" stroke="#9d8262" stroke-width="3" opacity="0.4"/>
  <rect y="550" width="1200" height="28" fill="#d3c1a8" opacity="0.8"/>

  <!-- Fenêtre -->
  <rect x="72" y="92" width="230" height="286" rx="3" fill="#6d543e"/>
  <rect x="84" y="104" width="206" height="262" fill="#dde7df"/>
  <path d="M187 104v262M84 235h206" stroke="#6d543e" stroke-width="8"/>
  <path d="M84 310c38-18 70-14 100 4 30 18 64 16 106-2v52H84Z" fill="#9cac90" opacity="0.75"/>
  <path d="M84 338c34-10 64-6 94 10 30 16 62 12 108-6v26H84Z" fill="#829678" opacity="0.7"/>
  <rect x="56" y="84" width="262" height="10" fill="#5e4735"/>
  <rect x="56" y="366" width="262" height="12" fill="#5e4735"/>
  <path d="M44 74h34c-4 76 0 176 8 298H44Z" fill="#f0e6d4"/>
  <path d="M300 74h34v298h-42c8-122 12-222 8-298Z" fill="#f0e6d4"/>

  <!-- Lumière -->
  <path d="M301 390 680 750H230L62 390Z" fill="#fff2d6" opacity="0.18"/>

  <!-- Bureau -->
  <ellipse cx="660" cy="620" rx="390" ry="30" fill="#6f533d" opacity="0.14"/>
  <rect x="280" y="432" width="760" height="50" rx="6" fill="url(#desk)"/>
  <rect x="300" y="482" width="720" height="112" fill="#916e50"/>
  <rect x="322" y="500" width="300" height="72" rx="3" fill="#805f45"/>
  <rect x="650" y="500" width="340" height="72" rx="3" fill="#805f45"/>
  <circle cx="470" cy="538" r="4" fill="#c8b08f"/>
  <circle cx="760" cy="538" r="4" fill="#c8b08f"/>
  <path d="M328 594v92M992 594v92" stroke="#6f533d" stroke-width="18" stroke-linecap="round"/>

  <!-- Chaise -->
  <g>
    <rect x="730" y="300" width="150" height="118" rx="8" fill="#8a6a4f"/>
    <rect x="742" y="312" width="126" height="76" rx="5" fill="#9d8064"/>
    <rect x="736" y="418" width="138" height="18" rx="4" fill="#745741"/>
    <path d="M748 436v92M860 436v92" stroke="#745741" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Lettres -->
  <g>
    <path d="M392 390h210v150H392Z" fill="url(#paper)"/>
    <path d="M392 390c12-18 198-18 210 0" fill="#fdf9f0"/>
    <path d="M420 420h152M420 438h132M420 456h146M420 474h98" stroke="#c3b198" stroke-width="2.5"/>
    <path d="M420 500h110" stroke="#d4c6ad" stroke-width="2.5"/>
    <path d="M500 540c8-16 30-16 38 0" fill="none" stroke="#b9a687" stroke-width="2"/>
    <path d="M552 390l30 58" stroke="#e3d6c1" stroke-width="1.5" opacity="0.6"/>
  </g>

  <g>
    <path d="M636 414l158-6 8 100-160 8Z" fill="#efe3ce"/>
    <path d="M636 414l80 46 78-52" fill="none" stroke="#c9b79c" stroke-width="2.5"/>
    <path d="M648 452l58 34M778 406l-12 64" stroke="#d4c2a7" stroke-width="2"/>
  </g>

  <g>
    <path d="M816 424h118v28H816Z" fill="#f7f1e6"/>
    <path d="M816 424l58 26 60-26" fill="none" stroke="#c9b79c" stroke-width="2"/>
    <rect x="858" y="420" width="34" height="8" rx="2" fill="#b47c68"/>
  </g>

  <!-- Loupe -->
  <g>
    <circle cx="940" cy="386" r="52" fill="#dbe4e9" opacity="0.55"/>
    <circle cx="940" cy="386" r="52" fill="none" stroke="#7a5c43" stroke-width="9"/>
    <path d="M978 424l52 62" stroke="#7a5c43" stroke-width="12" stroke-linecap="round"/>
    <path d="M912 360c8-14 22-22 38-24" fill="none" stroke="#f7f1e6" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Lampe -->
  <g>
    <path d="M570 428v-86c0-12 8-20 20-20h12" fill="none" stroke="#5e4735" stroke-width="8" stroke-linecap="round"/>
    <path d="M582 322c8-34 46-34 56 0Z" fill="#cbb18a"/>
    <ellipse cx="610" cy="360" rx="92" ry="58" fill="url(#lamp-glow)"/>
    <rect x="568" y="418" width="46" height="10" rx="3" fill="#5e4735"/>
  </g>

  <!-- Encrier et plume -->
  <g>
    <rect x="352" y="392" width="30" height="34" rx="4" fill="#405a6b"/>
    <path d="M357 392c0-8 20-8 20 0" fill="none" stroke="#405a6b" stroke-width="3"/>
    <path d="M430 388c14-28 30-38 44-42-2 18-10 34-26 48Z" fill="#d9c4a5"/>
    <path d="M426 394l30-24" stroke="#7a5c43" stroke-width="2"/>
  </g>

  <rect width="1200" height="750" fill="url(#lamp-glow)" opacity="0.2"/>
</svg>
