    <path d="M0 608h1200M0 656h1200M0 704h1200"/>
    <path d="M200 560v190M440 560v190M680 560v190M920 560v190"/>
  </g>
  <rect y="540" width="1200" height="30" fill="#d3c1a8" opacity="0.85"/>

  <!-- Fenêtre -->
  <rect x="824" y="104" width="238" height="274" rx="3" fill="#6d543e"/>
  <rect x="836" y="116" width="214" height="250" fill="url(#glass)"/>
