  <path d="M836 302c44-20 82-16 114 4 32 20 62 18 100 2v58H836Z" fill="#9cac90" opacity="0.8"/>
  <path d="M836 334c40-12 74-8 106 10 34 18 68 14 108-4v26H836Z" fill="#829678" opacity="0.7"/>
  <rect x="806" y="96" width="274" height="10" fill="#5e4735"/>
