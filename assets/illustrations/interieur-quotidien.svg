<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="interieur-title interieur-desc">
  <title id="interieur-title">La salle commune</title>
  <desc id="interieur-desc">Illustration originale : une salle commune avec une grande table, des bols, des livres, un poêle et une fenêtre. Aucune personne n'est représentée.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eee5d7"/>
      <stop offset="1" stop-color="#dfd2bf"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6ab89"/>
      <stop offset="1" stop-color="#ac8f6b"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a37e5b"/>
      <stop offset="1" stop-color="#836047"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7eee7"/>
      <stop offset="1" stop-color="#cbd8c8"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7b8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffe7b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#wall)"/>
  <rect y="560" width="1200" height="190" fill="url(#floor)"/>
  <path d="M0 560h1200" stroke="#9d8262" stroke-width="3" opacity="0.5"/>
