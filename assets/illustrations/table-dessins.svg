<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="dessins-title dessins-desc">
  <title id="dessins-title">La table des dessins</title>
  <desc id="dessins-desc">Illustration originale : une table avec des feuilles vierges, des crayons de couleur, un portfolio fermé et un cadre vide. Aucun dessin d'enfant n'est reproduit.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece3d4"/>
      <stop offset="1" stop-color="#dfd2bf"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5ab89"/>
      <stop offset="1" stop-color="#a98d6b"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a47f5c"/>
      <stop offset="1" stop-color="#805e43"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf9f0"/>
      <stop offset="1" stop-color="#f1e7d6"/>
    </linearGradient>
    <radialGradient id="light" cx="0.7" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#fff7e7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff7e7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#wall)"/>
  <rect y="570" width="1200" height="180" fill="url(#floor)"/>
  <path d="M0 570h1200" stroke="#9d8262" stroke-width="3" opacity="0.4"/>
  <rect y="550" width="1200" height="28" fill="#d3c1a8" opacity="0.8"/>

  <!-- Fenêtre -->
  <rect x="842" y="88" width="240" height="290" rx="3" fill="#6d543e"/>
  <rect x="854" y="100" width="216" height="266" fill="#e3ece4"/>
  <path d="M962 100v266M854 233h216" stroke="#6d543e" stroke-width="8"/>
  <path d="M854 312c40-18 72-14 104 4 30 18 62 14 112-2v52H854Z" fill="#9cac90" opacity="0.78"/>
  <path d="M854 340c34-10 64-6 94 10 30 16 64 12 122-6v22H854Z" fill="#829678" opacity="0.7"/>
  <rect x="826" y="80" width="272" height="10" fill="#5e4735"/>
  <rect x="826" y="370" width="272" height="12" fill="#5e4735"/>
  <path d="M814 70h32c-4 78 0 178 8 306h-40Z" fill="#f0e6d4"/>
  <path d="M1078 70h32v306h-40c8-128 12-228 8-306Z" fill="#f0e6d4"/>

  <!-- Table -->
  <ellipse cx="580" cy="622" rx="390" ry="30" fill="#6f533d" opacity="0.14"/>
  <rect x="210" y="428" width="790" height="50" rx="6" fill="url(#table)"/>
  <rect x="230" y="478" width="750" height="116" fill="#916e50"/>
  <rect x="252" y="496" width="310" height="76" rx="3" fill="#805f45"/>
  <rect x="602" y="496" width="358" height="76" rx="3" fill="#805f45"/>
  <circle cx="410" cy="536" r="4" fill="#c8b08f"/>
  <circle cx="780" cy="536" r="4" fill="#c8b08f"/>
  <path d="M258 594v94M974 594v94" stroke="#6f533d" stroke-width="18" stroke-linecap="round"/>

  <!-- Feuilles vierges -->
  <g>
    <path d="M356 388l232-10 8 148-236 12Z" fill="url(#paper)"/>
    <path d="M372 408h180M372 428h154M372 448h166" stroke="#ded0b9" stroke-width="2" opacity="0.6"/>
    <path d="M392 486c20-12 42-12 62 0" fill="none" stroke="#e3d6c1" stroke-width="2"/>
    <path d="M604 402l216 6-4 138-220-6Z" fill="#f7f1e6"/>
    <path d="M622 430h160M622 450h136" stroke="#ded0b9" stroke-width="2" opacity="0.55"/>
  </g>

  <!-- Crayons -->
  <g>
    <rect x="700" y="392" width="132" height="34" rx="7" fill="#8a6a4f"/>
    <rect x="712" y="386" width="10" height="48" rx="3" fill="#b47c68"/>
    <rect x="730" y="382" width="10" height="54" rx="3" fill="#c2a267"/>
    <rect x="748" y="388" width="10" height="46" rx="3" fill="#6f806b"/>
    <rect x="766" y="384" width="10" height="50" rx="3" fill="#405a6b"/>
    <rect x="784" y="390" width="10" height="44" rx="3" fill="#9d8064"/>
    <path d="M712 386l5-12 5 12M730 382l5-12 5 12M748 388l5-12 5 12M766 384l5-12 5 12M784 390l5-12 5 12" fill="#e8ddc9"/>
  </g>

  <!-- Portfolio -->
  <g>
    <path d="M826 396l150 18-16 104-152-18Z" fill="#7a5c43"/>
    <path d="M838 406l126 15-4 28-128-15Z" fill="#8a6a4f"/>
    <path d="M856 418l80 10" stroke="#c9b79c" stroke-width="3"/>
    <path d="M1006 420l18-10" stroke="#5e4735" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Cadre vide -->
  <g>
    <rect x="94" y="172" width="214" height="270" fill="#8a6a4f"/>
    <rect x="108" y="186" width="186" height="242" fill="#f7f1e6"/>
    <rect x="124" y="202" width="154" height="210" fill="#efe6d6"/>
    <path d="M124 202h154v210H124Z" fill="none" stroke="#d9c9b2" stroke-width="2"/>
    <path d="M168 396h66" stroke="#d9c9b2" stroke-width="2"/>
  </g>

  <!-- Chaise -->
  <g>
    <rect x="270" y="284" width="144" height="122" rx="8" fill="#8a6a4f"/>
    <rect x="282" y="296" width="120" height="78" rx="5" fill="#9d8064"/>
    <rect x="276" y="404" width="132" height="18" rx="4" fill="#745741"/>
    <path d="M288 422v96M396 422v96" stroke="#745741" stroke-width="10" stroke-linecap="round"/>
  </g>

  <rect width="1200" height="750" fill="url(#light)"/>
</svg>
