<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="archives-title archives-desc">
  <title id="archives-title">La salle d'archives</title>
  <desc id="archives-desc">Illustration originale : une salle d'archives avec des boîtes, des rayonnages, une table de consultation et une lampe. Les étiquettes restent abstraites.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7dfd1"/>
      <stop offset="1" stop-color="#d8cbb8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2a987"/>
      <stop offset="1" stop-color="#a48764"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c6a7"/>
      <stop offset="1" stop-color="#bfa986"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7656"/>
      <stop offset="1" stop-color="#7b5a40"/>
    </linearGradient>
    <radialGradient id="light" cx="0.7" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#fff4dd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff4dd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#wall)"/>
  <rect y="566" width="1200" height="184" fill="url(#floor)"/>
  <path d="M0 566h1200" stroke="#9d8262" stroke-width="3" opacity="0.4"/>
  <rect y="546" width="1200" height="28" fill="#d3c1a8" opacity="0.8"/>

  <!-- Rayonnages -->
  <g>
    <rect x="58" y="92" width="300" height="470" fill="#8a6a4f"/>
    <rect x="72" y="106" width="272" height="442" fill="#755840"/>
    <g>
      <rect x="72" y="230" width="272" height="12" fill="#6d543e"/>
      <rect x="72" y="360" width="272" height="12" fill="#6d543e"/>
      <rect x="72" y="490" width="272" height="12" fill="#6d543e"/>
    </g>
    <g fill="url(#box)">
      <rect x="88" y="140" width="54" height="90" rx="2"/>
      <rect x="150" y="132" width="58" height="98" rx="2"/>
      <rect x="216" y="146" width="52" height="84" rx="2"/>
      <rect x="276" y="136" width="54" height="94" rx="2"/>
      <rect x="88" y="264" width="62" height="96" rx="2"/>
      <rect x="158" y="272" width="54" height="88" rx="2"/>
      <rect x="220" y="258" width="60" height="102" rx="2"/>
      <rect x="288" y="268" width="42" height="92" rx="2"/>
      <rect x="88" y="398" width="54" height="92" rx="2"/>
      <rect x="150" y="390" width="62" height="100" rx="2"/>
      <rect x="220" y="402" width="52" height="88" rx="2"/>
      <rect x="280" y="396" width="52" height="94" rx="2"/>
      <rect x="88" y="516" width="58" height="24" rx="2"/>
      <rect x="154" y="512" width="54" height="28" rx="2"/>
      <rect x="216" y="518" width="60" height="22" rx="2"/>
    </g>
    <g stroke="#8a6a4f" stroke-width="2" opacity="0.6">
      <path d="M102 158h26M164 152h30M230 164h24M290 154h26M102 282h30M172 290h26M234 278h32M302 286h16M102 416h26M164 410h32M234 420h24M294 414h24"/>
    </g>
  </g>

  <!-- Rayonnage de droite -->
  <g>
    <rect x="984" y="166" width="158" height="396" fill="#8a6a4f"/>
    <rect x="996" y="178" width="134" height="372" fill="#755840"/>
    <rect x="996" y="300" width="134" height="10" fill="#6d543e"/>
    <rect x="996" y="420" width="134" height="10" fill="#6d543e"/>
    <g fill="url(#box)">
      <rect x="1008" y="202" width="48" height="88" rx="2"/>
      <rect x="1064" y="196" width="54" height="94" rx="2"/>
      <rect x="1008" y="322" width="56" height="88" rx="2"/>
      <rect x="1072" y="330" width="44" height="80" rx="2"/>
      <rect x="1008" y="442" width="48" height="92" rx="2"/>
      <rect x="1064" y="436" width="54" height="98" rx="2"/>
    </g>
  </g>

  <!-- Table de consultation -->
  <ellipse cx="640" cy="632" rx="330" ry="26" fill="#6f533d" opacity="0.14"/>
  <rect x="404" y="454" width="540" height="48" rx="6" fill="url(#table)"/>
  <rect x="424" y="502" width="500" height="102" fill="#8d6b4d"/>
  <rect x="444" y="518" width="220" height="66" rx="3" fill="#7b5b40"/>
  <rect x="684" y="518" width="220" height="66" rx="3" fill="#7b5b40"/>
  <path d="M432 604v82M916 604v82" stroke="#6f533d" stroke-width="16" stroke-linecap="round"/>

  <!-- Boîte ouverte -->
  <g>
    <path d="M512 402h174v52H512Z" fill="url(#box)"/>
    <path d="M512 402l28-24h120l26 24Z" fill="#e0cfb2"/>
    <path d="M540 378v24M660 378v24" stroke="#b9a687" stroke-width="2"/>
    <path d="M538 398h122" stroke="#8a6a4f" stroke-width="2" opacity="0.6"/>
    <path d="M524 414h98M524 424h72" stroke="#8a6a4f" stroke-width="2" opacity="0.45"/>
  </g>

  <!-- Dossiers sur la table -->
  <g>
    <path d="M708 420l148-12 10 44-150 14Z" fill="#d8c6a7"/>
    <path d="M716 410l140-10 4 16-142 12Z" fill="#e6d7bf"/>
    <path d="M748 424l70-6" stroke="#a98e6c" stroke-width="2"/>
    <path d="M606 428l86-8 6 34-88 8Z" fill="#efe3ce"/>
    <path d="M614 438l62-6" stroke="#b9a687" stroke-width="2"/>
