  <g>
    <path d="M790 446v-94c0-12 10-20 22-20h14" fill="none" stroke="#5e4735" stroke-width="8" stroke-linecap="round"/>
    <path d="M802 336c10-32 48-32 58 0Z" fill="#cbb18a"/>
    <ellipse cx="832" cy="382" rx="92" ry="62" fill="url(#light)"/>
    <rect x="782" y="436" width="52" height="10" rx="3" fill="#5e4735"/>
  </g>

  <!-- Échelle -->
  <g>
    <path d="M960 566V246M1000 566V246" stroke="#7a5c43" stroke-width="7" stroke-linecap="round"/>
    <path d="M962 300h36M962 360h36M962 420h36M962 480h36M962 540h36" stroke="#8a6a4f" stroke-width="5"/>
  </g>

  <rect width="1200" height="750" fill="url(#light)" opacity="0.65"/>
</svg>
