<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="parcours-title parcours-desc">
  <title id="parcours-title">Schéma des parcours</title>
  <desc id="parcours-desc">Schéma de médiation original, non à l'échelle : Izieu, Montluc, Drancy, puis deux destinations distinctes, Auschwitz-Birkenau et Reval. Tous les parcours ne sont pas identiques.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece6d9"/>
      <stop offset="1" stop-color="#ddd3c1"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5c43"/>
      <stop offset="1" stop-color="#405a6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e9" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff8e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <g stroke="#b9aa91" stroke-width="1" opacity="0.28">
    <path d="M0 150h1200M0 300h1200M0 450h1200M0 600h1200"/>
    <path d="M150 0v750M300 0v750M450 0v750M600 0v750M750 0v750M900 0v750M1050 0v750"/>
  </g>
  <circle cx="930" cy="120" r="170" fill="url(#glow)"/>

  <!-- Ligne principale -->
  <path d="M150 600c70-48 128-70 210-90 84-20 160-30 240-40" fill="none" stroke="url(#route)" stroke-width="10" stroke-linecap="round"/>
  <path d="M600 470c64-6 112-2 160 18" fill="none" stroke="#405a6b" stroke-width="10" stroke-linecap="round"/>
  <path d="M760 488c56-44 102-96 166-160" fill="none" stroke="#405a6b" stroke-width="10" stroke-linecap="round"/>
  <path d="M760 488c58 38 100 78 166 122" fill="none" stroke="#6f806b" stroke-width="10" stroke-linecap="round"/>

  <!-- Pointillés : autres convois -->
  <path d="M600 500c70 48 118 76 184 94" fill="none" stroke="#8a6a4f" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round" opacity="0.5"/>
  <path d="M600 440c54-40 102-70 168-98" fill="none" stroke="#8a6a4f" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round" opacity="0.5"/>

  <!-- Noeuds -->
  <g>
    <circle cx="150" cy="600" r="34" fill="#f7f1e6" stroke="#7a5c43" stroke-width="4"/>
    <path d="M135 600v14h30v-14M132 598l18-14 18 14" fill="none" stroke="#7a5c43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="664" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#272522">Izieu</text>
    <text x="150" y="690" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" letter-spacing="2" fill="#736c62">MAI 1943 – AVRIL 1944</text>
  </g>
  <g>
    <circle cx="360" cy="510" r="30" fill="#f7f1e6" stroke="#7a5c43" stroke-width="4"/>
    <path d="M348 502h24v22h-24zM344 524h32M354 496v6M366 496v6" fill="none" stroke="#7a5c43" stroke-width="3" stroke-linecap="round"/>
    <text x="360" y="564" text-anchor="middle" font-family="Georgia, serif" font-size="23" fill="#272522">Montluc</text>
    <text x="360" y="588" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" letter-spacing="1.6" fill="#736c62">6–7 AVRIL 1944</text>
  </g>
  <g>
    <circle cx="600" cy="470" r="30" fill="#f7f1e6" stroke="#405a6b" stroke-width="4"/>
    <path d="M586 458h28v24h-28zM586 470h28M600 458v24" fill="none" stroke="#405a6b" stroke-width="3"/>
    <text x="600" y="524" text-anchor="middle" font-family="Georgia, serif" font-size="23" fill="#272522">Drancy</text>
    <text x="600" y="548" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" letter-spacing="1.6" fill="#736c62">8 AVRIL 1944</text>
  </g>
  <g>
    <circle cx="930" cy="300" r="34" fill="#f7f1e6" stroke="#405a6b" stroke-width="4"/>
    <path d="M916 300h28M930 286v28M922 292l16 16M938 292l-16 16" fill="none" stroke="#405a6b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="930" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="23" fill="#272522">Auschwitz-Birkenau</text>
    <text x="930" y="386" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" letter-spacing="1.4" fill="#736c62">42 ENFANTS · 5 ADULTES</text>
  </g>
  <g>
    <circle cx="930" cy="620" r="34" fill="#f7f1e6" stroke="#6f806b" stroke-width="4"/>
    <path d="M916 620h28M930 606v28M922 612l16 16M938 612l-16 16" fill="none" stroke="#6f806b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="930" y="682" text-anchor="middle" font-family="Georgia, serif" font-size="23" fill="#272522">Reval</text>
    <text x="930" y="706" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" letter-spacing="1.4" fill="#736c62">MIRON ZLATIN · THÉO REIS · ARNOLD HIRSCH</text>
  </g>

  <!-- Étiquettes de convois -->
  <g font-family="Segoe UI, sans-serif" font-size="14" letter-spacing="1.4" fill="#405a6b">
    <text x="664" y="430" transform="rotate(-18 664 430)">CONVOI 73 · 15 MAI 1944</text>
    <text x="652" y="566" transform="rotate(18 652 566)">CONVOIS DOCUMENTÉS · AVRIL–JUIN 1944</text>
  </g>

  <!-- Légende -->
  <g>
    <rect x="52" y="52" width="420" height="78" rx="6" fill="#f7f1e6" opacity="0.8"/>
    <text x="72" y="82" font-family="Segoe UI, sans-serif" font-size="13" letter-spacing="2" fill="#7a5c43">SCHÉMA DE MÉDIATION</text>
    <text x="72" y="108" font-family="Segoe UI, sans-serif" font-size="15" fill="#4d4943">Représentation non à l'échelle. Les parcours diffèrent.</text>
  </g>
  <g>
    <circle cx="1016" cy="78" r="6" fill="#405a6b"/>
    <text x="1032" y="84" font-family="Segoe UI, sans-serif" font-size="14" fill="#4d4943">Destination</text>
  </g>
</svg>
