  <g>
    <path d="M1060 282h40M1078 282v18" stroke="#6d543e" stroke-width="6" stroke-linecap="round"/>
    <path d="M1048 300c-18 30-22 66-16 114h62c6-48 2-84-16-114-8-8-22-8-30 0Z" fill="#6f7d68"/>
    <path d="M1060 306v96M1078 306v96" stroke="#5d6a58" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Bureau -->
  <rect x="288" y="430" width="590" height="42" rx="4" fill="url(#desk)"/>
  <rect x="304" y="472" width="558" height="124" fill="#8d6b4d"/>
  <rect x="320" y="490" width="220" height="88" rx="3" fill="#7b5b40"/>
  <rect x="556" y="490" width="286" height="88" rx="3" fill="#7b5b40"/>
  <circle cx="430" cy="534" r="4" fill="#c8b08f"/>
  <circle cx="620" cy="534" r="4" fill="#c8b08f"/>
  <rect x="306" y="596" width="24" height="86" fill="#6f533d"/>
  <rect x="838" y="596" width="24" height="86" fill="#6f533d"/>

  <!-- Chaise -->
  <rect x="392" y="332" width="178" height="116" rx="10" fill="#7d5d43"/>
  <rect x="406" y="346" width="150" height="72" rx="6" fill="#8d6b4d"/>
  <rect x="408" y="448" width="146" height="22" rx="5" fill="#6d5039"/>
  <path d="M416 470v84M546 470v84" stroke="#6d5039" stroke-width="10" stroke-linecap="round"/>

  <!-- Objets sur le bureau -->
  <g>
    <path d="M360 412h150v22H360Z" fill="#f4ecdd"/>
    <path d="M360 412c18-16 132-16 150 0" fill="#fbf5e9"/>
    <path d="M382 420h96M382 426h72" stroke="#b9a98e" stroke-width="2"/>
    <path d="M532 408h116v24H532Z" fill="#efe3ce"/>
    <path d="M548 416h82M548 422h64" stroke="#c0ad91" stroke-width="2"/>
    <rect x="688" y="386" width="36" height="46" rx="4" fill="#405a6b"/>
    <rect x="696" y="378" width="20" height="10" rx="2" fill="#2f4654"/>
    <path d="M706 388v38" stroke="#dbe4e9" stroke-width="2" opacity="0.5"/>
    <path d="M756 432v-46h18v46" fill="#6d543e"/>
    <path d="M744 386c0-28 8-44 21-52 13 8 21 24 21 52Z" fill="#cbb18a"/>
    <ellipse cx="765" cy="386" rx="54" ry="30" fill="url(#lamp-glow)"/>
    <g>
      <rect x="600" y="398" width="72" height="30" rx="8" fill="#3f3a33"/>
      <path d="M612 398c4-18 44-18 48 0" fill="none" stroke="#3f3a33" stroke-width="7"/>
      <circle cx="620" cy="413" r="9" fill="#6b6258"/>
      <circle cx="652" cy="413" r="9" fill="#6b6258"/>
    </g>
    <rect x="472" y="400" width="16" height="28" rx="3" fill="#405a6b"/>
    <path d="M474 400c0-8 12-8 12 0" fill="none" stroke="#405a6b" stroke-width="3"/>
  </g>

  <!-- Chaise vide à droite -->
  <g opacity="0.9">
    <rect x="906" y="430" width="120" height="86" rx="8" fill="#8a6a4f"/>
    <rect x="918" y="442" width="96" height="54" rx="4" fill="#9d8064"/>
    <rect x="912" y="516" width="108" height="16" rx="4" fill="#745741"/>
    <path d="M922 532v78M1010 532v78" stroke="#745741" stroke-width="9" stroke-linecap="round"/>
