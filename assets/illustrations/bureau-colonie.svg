<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="bureau-title bureau-desc">
  <title id="bureau-title">Le bureau de la colonie</title>
  <desc id="bureau-desc">Illustration originale : un bureau de travail avec un registre, une lampe, un téléphone et une fenêtre ouverte sur la campagne. Aucun portrait inventé.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eee5d6"/>
      <stop offset="1" stop-color="#e2d5c1"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7ad8b"/>
      <stop offset="1" stop-color="#b39673"/>
    </linearGradient>
    <linearGradient id="window-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ece6"/>
      <stop offset="1" stop-color="#cfdac9"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b7655"/>
      <stop offset="1" stop-color="#7f5d42"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9bd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2d6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff2d6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#wall)"/>
  <rect y="580" width="1200" height="170" fill="url(#floor)"/>
  <path d="M0 580h1200" stroke="#a98f70" stroke-width="3" opacity="0.45"/>
  <g stroke="#a98f70" stroke-width="2" opacity="0.24">
    <path d="M0 620h1200M0 668h1200M0 716h1200"/>
    <path d="M180 580v170M420 580v170M660 580v170M900 580v170"/>
  </g>
  <rect y="560" width="1200" height="36" fill="#d8c8b1" opacity="0.9"/>

  <!-- Fenêtre -->
  <rect x="818" y="96" width="246" height="276" rx="4" fill="#6d543e"/>
  <rect x="830" y="108" width="222" height="252" fill="url(#window-glass)"/>
  <path d="M941 108v252M830 234h222" stroke="#6d543e" stroke-width="8"/>
  <path d="M830 300c50-22 90-18 128 6 34 22 60 20 94 2v52H830Z" fill="#9bab8f" opacity="0.8"/>
  <path d="M830 330c42-16 78-12 112 8 36 20 68 16 110-2v24H830Z" fill="#829678" opacity="0.8"/>
  <path d="M838 126h34v92h-34zM1010 126h34v92h-34z" fill="#f4ecdd" opacity="0.28"/>
  <rect x="800" y="90" width="282" height="10" fill="#5e4735"/>
  <rect x="800" y="364" width="282" height="14" fill="#5e4735"/>

  <!-- Rideaux -->
  <path d="M766 78h58c-10 88-6 198 4 312h-62Z" fill="#f0e6d4"/>
  <path d="M1058 78h58v312h-62c10-114 14-224 4-312Z" fill="#f0e6d4"/>
  <path d="M782 84c-4 96 0 206 8 298M1086 84c4 96 0 206-8 298" fill="none" stroke="#d9c9b2" stroke-width="3"/>

  <path d="M818 390 560 750h520L1080 390Z" fill="url(#beam)"/>

  <!-- Étagère -->
  <g>
    <rect x="66" y="170" width="228" height="14" fill="#7a5c43"/>
    <rect x="66" y="304" width="228" height="14" fill="#7a5c43"/>
    <rect x="72" y="194" width="18" height="110" fill="#6d543e"/>
    <rect x="270" y="194" width="18" height="110" fill="#6d543e"/>
    <rect x="98" y="200" width="16" height="104" fill="#8a6a4f"/>
    <rect x="118" y="214" width="13" height="90" fill="#6f806b"/>
    <rect x="135" y="192" width="18" height="112" fill="#9d8064"/>
    <rect x="157" y="222" width="12" height="82" fill="#405a6b"/>
    <rect x="173" y="204" width="20" height="100" fill="#7a5c43"/>
    <path d="M205 304c0-42 4-72 18-100 14 28 18 58 18 100Z" fill="#8a6a4f"/>
    <path d="M96 184h146" stroke="#5e4735" stroke-width="3" opacity="0.5"/>
  </g>

